name: CI Workflow

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - 'main'

jobs:
  ci_job:
    name: CI Job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Record start time
        id: start_time
        run: echo "started_at=$(date -u +%s)" >> $GITHUB_OUTPUT

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
            python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_pyspark.txt
          pip install -e .

      - name: Run pytest & generate coverage report
        run: |
          pytest \
            --disable-warnings \
            --cov=./src \
            --cov-report=html

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov

      - name: Write metrics to Databricks
        if: always()
        run: |
          END=$(date -u +%s)
          DURATION=$((END - ${{ steps.start_time.outputs.started_at }}))
          STARTED_AT=$(date -u -d @${{ steps.start_time.outputs.started_at }} +"%Y-%m-%d %H:%M:%S")
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.DATABRICKS_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.DATABRICKS_HOST }}/api/2.0/sql/statements" \
            -d @- <<EOF
          {
            "warehouse_id": "${{ secrets.DATABRICKS_SQL_WAREHOUSE_ID }}",
            "statement": "INSERT INTO citibike_dev.ops.cicd_metrics VALUES ('${{ github.run_id }}', '${{ github.workflow }}', 'CI Job', 'n-a', '${{ github.ref_name }}', '${{ job.status }}', $DURATION, '$STARTED_AT', NULL)",
            "wait_timeout": "30s"
          }
          EOF