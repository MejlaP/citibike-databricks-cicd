resources:
  jobs:
    citibike_etl_pipeline_py:                          # Unique key identifying this job within the bundle
      name: citibike_etl_pipeline_py_${bundle.target}  # Append the target name (dev/test/prod) to the job name.
                                                       # Since test and prod share the same workspace (Free Edition
                                                       # limitation), without this suffix they'd have identical
                                                       # names and overwrite each other in Databricks Workflows.
      tasks:
        - task_key: 01_bronze_citibike        # First task: run the Bronze script
          spark_python_task:
            python_file: ../citibike_etl/scripts/01_bronze/01_bronze_citibike.py
            parameters:
              - "{{job.id}}"
              - "{{job.run_id}}"
              - "{{task.run_id}}"
              - "{{job.start_time.iso_datetime}}"
              - "${var.catalog}"        # Injects the bundle's catalog variable (citibike_dev/test/prod)
            source: WORKSPACE                  # Script is deployed/read from the Databricks workspace
          environment_key: Default             # Required for spark_python_task on serverless — unlike
                                                 # notebook_task, it won't run without an explicit environment

        - task_key: 02_silver_citibike
          depends_on:
            - task_key: 01_bronze_citibike     # Silver only runs after Bronze completes successfully
          spark_python_task:
            python_file: ../citibike_etl/scripts/02_silver/02_silver_citibike.py
            parameters:
              - "{{job.id}}"
              - "{{job.run_id}}"
              - "{{task.run_id}}"
              - "{{job.start_time.iso_datetime}}"
              - "${var.catalog}"        # Injects the bundle's catalog variable (citibike_dev/test/prod)
            source: WORKSPACE
          environment_key: Default

        - task_key: 03_gold_citibike_daily_ride_summary
          depends_on:
            - task_key: 02_silver_citibike     # Both Gold tasks depend on Silver, so they can run in parallel
          spark_python_task:
            python_file: ../citibike_etl/scripts/03_gold/03_gold_citibike_daily_ride_summary.py
            source: WORKSPACE
            parameters:
              - "${var.catalog}"        # Injects the bundle's catalog variable (citibike_dev/test/prod)
          environment_key: Default

        - task_key: 03_gold_citibike_daily_station_performance
          depends_on:
            - task_key: 02_silver_citibike
          spark_python_task:
            python_file: ../citibike_etl/scripts/03_gold/03_gold_citibike_daily_station_performance.py
            source: WORKSPACE
            parameters:
              - "${var.catalog}"        # Injects the bundle's catalog variable (citibike_dev/test/prod)
          environment_key: Default

      environments:                            # Defines the serverless environment(s) referenced by
                                               # environment_key above — required for spark_python_task
        - environment_key: Default
          spec:
            environment_version: '2'           # Client/environment spec version for serverless execution
            dependencies:
              - ../dist/*.whl                 # Installs the built wheel package (dab_project) into this
                                              # environment, so "from citibike.citibike_utils import ..."
                                              # resolves without the manual sys.path/src. prefix trick

      queue:
        enabled: true                          # Allows multiple runs to queue instead of failing if one is already running
      performance_target: PERFORMANCE_OPTIMIZED # Prioritizes faster serverless startup/execution over cost savings