# This is a Declarative Automation Bundle definition for dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_project
  uuid: 7a8fedc0-e2fc-4af6-8b74-827836ae2aec

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    default: "citibike_dev"
  dev_flag:
    default: true

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-7cf25b78-6ae1.cloud.databricks.com
    variables:
      catalog: citibike_dev
      dev_flag:
        default: true
  test:
    mode: production
    workspace:
      host: https://dbc-7cf25b78-6ae1.cloud.databricks.com
      # We explicitly deploy to /Workspace/Shared/.bundle/${bundle.name}/${bundle.target} to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: citibike_test
      dev_flag:
        default: false
    permissions:
      - user_name: ice99@seznam.cz
        level: CAN_MANAGE
  prod:
    mode: production
    workspace:
      host: https://dbc-7cf25b78-6ae1.cloud.databricks.com
      # We explicitly deploy to /Workspace/Shared/.bundle/${bundle.name}/${bundle.target} to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: citibike_prod
      dev_flag:
        default: false
    permissions:
      - user_name: ice99@seznam.cz
        level: CAN_MANAGE
